<!DOCTYPE html>
<html>
<head><title>ex09 display</title></head>
<body>
<table border="1">
  <tr>
    <th>name</th>
    <th>homeworld</th>
    <th>climate</th>
  </tr>
  {% for person in people %}
  <tr>
    <td>{{ person.name }}</td>
    <td>{{ person.homeworld.name }}</td>
    <td>{{ person.homeworld.climate }}</td>
  </tr>
  {% endfor %}
</table>
</body>
</html>
