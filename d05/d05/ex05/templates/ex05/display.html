<!DOCTYPE html>
<html>
<head><title>ex05 movies</title></head>
<body>
<table border="1">
  <tr>
    <th>episode_nb</th>
    <th>title</th>
    <th>opening_crawl</th>
    <th>director</th>
    <th>producer</th>
    <th>release_date</th>
  </tr>
  {% for movie in movies %}
  <tr>
    <td>{{ movie.episode_nb }}</td>
    <td>{{ movie.title }}</td>
    <td>{{ movie.opening_crawl }}</td>
    <td>{{ movie.director }}</td>
    <td>{{ movie.producer }}</td>
    <td>{{ movie.release_date }}</td>
  </tr>
  {% endfor %}
</table>
</body>
</html>
