<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ room.name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        #messages {
            height: 450px;
            overflow-y: scroll;
            border: 1px solid #dee2e6;
            border-radius: .375rem;
            padding: 12px;
            background: #f8f9fa;
        }
        #users-list {
            height: 450px;
            overflow-y: auto;
            border: 1px solid #b6d4fe;
            border-radius: .375rem;
            padding: 12px;
            background: #e7f1ff;
        }
        .msg-system { color: #6c757d; font-style: italic; text-align: center; font-size: .875rem; }
    </style>
</head>
<body>
<div class="container mt-4" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>{{ room.name }}</h2>
        <a href="/chat/" class="btn btn-sm btn-outline-secondary">← Rooms</a>
    </div>
    <div class="row">
        <div class="col-8">
            <div id="messages" class="mb-3"></div>
            <form id="message-form">
                <div class="input-group">
                    <input type="text" id="message-input" class="form-control" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="btn btn-primary">Send</button>
                </div>
            </form>
        </div>
        <div class="col-4">
            <div id="users-list">
                <h6 class="mb-2">Connected users</h6>
                <ul id="users-ul" class="list-unstyled mb-0"></ul>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const socket = new WebSocket('ws://' + window.location.host + '/ws/chat/{{ room.name }}/');

    socket.onmessage = function (e) {
        const data = JSON.parse(e.data);

        if (data.type === 'users') {
            $('#users-ul').empty();
            $.each(data.users, function (i, username) {
                $('#users-ul').append($('<li></li>').text(username));
            });
            return;
        }

        const $messages = $('#messages');
        let $el;

        if (data.is_join || data.is_leave) {
            $el = $('<div class="msg-system my-1"></div>').text(data.message);
        } else {
            $el = $('<div class="mb-1"></div>');
            $('<strong></strong>').text(data.username + ': ').appendTo($el);
            $('<span></span>').text(data.message).appendTo($el);
        }

        $messages.append($el);
        $messages.scrollTop($messages[0].scrollHeight);
    };

    socket.onclose = function () {
        $('#message-input').prop('disabled', true).attr('placeholder', 'Connection lost.');
    };

    $('#message-form').on('submit', function (e) {
        e.preventDefault();
        const msg = $('#message-input').val().trim();
        if (msg && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({message: msg}));
            $('#message-input').val('');
        }
    });
</script>
</body>
</html>
